services:
  # Data Base
  postgres:
    image: postgres:15-alpine
    container_name: project_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: project_minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  # Backend
  backend:
    build: ./server
    container_name: project_backend
    restart: always
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_USER_NAME=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_NAME=mydb
      - JWT_SECRET=your_super_secret_jwt_key_123
      - JWT_EXPIRES_IN=24h
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
    depends_on:
      - postgres
      - minio
    volumes:
      - ./client/public/staticImages:/app/static-seeds
    networks:
      - app-network

  # Frontend
  frontend:
    build: ./client
    container_name: project_frontend
    restart: always
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  miniodata:

networks:
  app-network:
    driver: bridge
